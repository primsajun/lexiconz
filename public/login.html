<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexiconz - Login</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="config.js"></script>
</head>
<body class="dark-theme" style="display: flex; justify-content: center; align-items: center; background: #000000; margin: 0; min-height: 100vh;">
    <div class="upload-card" style="margin: 0; text-align: left;">
        <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 2rem;">Welcome Back</h2>
        
        <div id="loginForm" style="display: flex; flex-direction: column; gap: 1rem; align-items: center;">
            <p style="color: var(--text-secondary); text-align: center; margin-bottom: 1rem;">Sign in to save your vocabulary and sync your reading progress across devices.</p>
            
            <button id="googleLoginBtn" class="btn primary-btn full-width" style="margin-top: 1rem; background: #db4437; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
            <p id="errorMsg" style="color: #ef4444; font-size: 0.9rem; text-align: center; margin-top: 1rem;"></p>
        </div>
        
        <p style="text-align: center; margin-top: 2rem;">
            <a href="index.html" class="btn secondary-btn" style="text-decoration: none;">← Back</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        async function initGoogleLogin() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                const sb = supabase.createClient(config.supabase_url, config.supabase_key);
                
                document.getElementById('googleLoginBtn').addEventListener('click', async () => {
                    document.getElementById('errorMsg').textContent = "Redirecting to Google...";
                    const { error } = await sb.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin + '/index.html?home=true'
                        }
                    });
                    if (error) {
                        document.getElementById('errorMsg').textContent = error.message;
                    }
                });
            } catch(err) {
                console.error("Config load failed", err);
                document.getElementById('errorMsg').textContent = "Failed to load authentication system.";
            }
        }
        initGoogleLogin();
    </script>
</body>
</html>
