<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordLens - Saved Vocabulary</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="config.js"></script>
    <style>
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .vocab-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
        }
        .vocab-word {
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: capitalize;
        }
        .vocab-meaning {
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        .vocab-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .delete-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: none;
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body class="dark-theme reader-layout">
    <nav class="reader-nav">
        <div class="nav-left">
            <a href="index.html" class="logo">Word<span class="highlight" style="background: #8b5cf6; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Lens</span></a>
        </div>
        <div class="controls">
            <span style="color: white; font-weight: bold;">Your Saved Vocabulary</span>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="btn white-btn">← Back</a>
        </div>
    </nav>

    <div class="container" style="flex: 1; overflow-y: auto;">
        <div id="vocabLoading" style="text-align: center; margin-top: 3rem;">
            <div class="spinner"></div>
            <p>Loading your library...</p>
        </div>
        <div id="vocabEmpty" class="hidden" style="text-align: center; margin-top: 4rem; color: var(--text-secondary);">
            <h2>Your library is empty.</h2>
            <p>Start reading and save some words!</p>
        </div>
        <div id="vocabGrid" class="vocab-grid"></div>
    </div>

    <script>
        const API_BASE = window.__WORDLENS_API_BASE__ || ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || !window.location.hostname) ? 'http://localhost:8000/api' : '/api');
        const userId = localStorage.getItem('user_id');
        
        if (!userId) {
            alert("Please login to view your vocabulary.");
            window.location.href = 'login.html';
        }

        async function fetchVocabulary() {
            try {
                const res = await fetch(`${API_BASE}/vocabulary?user_id=${userId}`);
                const data = await res.json();
                
                document.getElementById('vocabLoading').classList.add('hidden');
                
                if (data.data && data.data.length > 0) {
                    renderGrid(data.data);
                } else {
                    document.getElementById('vocabEmpty').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                alert("Error loading vocabulary.");
            }
        }

        function renderGrid(words) {
            const grid = document.getElementById('vocabGrid');
            grid.innerHTML = '';
            
            words.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteWord('${item.id}')">Delete</button>
                    <div class="vocab-word">${item.word}</div>
                    <div class="vocab-meaning">${item.meaning}</div>
                    ${item.translation ? `<div class="vocab-meaning" style="color: var(--accent); font-weight: 600;">Translation: ${item.translation}</div>` : ''}
                    <div class="vocab-meta">Saved from PDF on page ${item.page || 1}</div>
                `;
                grid.appendChild(card);
            });
        }

        async function deleteWord(id) {
            if(!confirm("Are you sure you want to delete this word?")) return;
            try {
                const res = await fetch(`${API_BASE}/vocabulary/${id}?user_id=${userId}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    fetchVocabulary(); // refresh list
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Init
        fetchVocabulary();
    </script>
</body>
</html>
