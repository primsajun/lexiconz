<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicona - Register</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="config.js"></script>
</head>
<body class="dark-theme" style="display: flex; justify-content: center; align-items: center; background: #000000; margin: 0; min-height: 100vh;">
    <div class="upload-card" style="margin: 0; text-align: left; padding: 2rem 3rem;">
        <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 2rem;">Create an Account</h2>
        
        <form id="registerForm" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label style="display: block; margin-bottom: 0.5rem; color: #fff;">Name</label>
                <input type="text" id="regName" required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.5); color: white;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.5rem; color: #fff;">Email</label>
                <input type="email" id="regEmail" required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.5); color: white;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.5rem; color: #fff;">Password</label>
                <input type="password" id="regPassword" required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.5); color: white;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.5rem; color: #fff;">Confirm Password</label>
                <input type="password" id="regConfirmPassword" required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.5); color: white;">
            </div>
            
            <p id="errorMsg" style="color: #ef4444; font-size: 0.9rem; text-align: center;"></p>
            
            <button type="submit" class="btn primary-btn full-width" style="margin-top: 1rem;">Register</button>
        </form>
        
        <p style="text-align: center; margin-top: 2rem; color: var(--text-secondary);">
            Already have an account? <a href="login.html" style="color: var(--primary-color); text-decoration: none;">Login</a>
        </p>
        <p style="text-align: center; margin-top: 1rem;">
            <a href="index.html" class="btn secondary-btn" style="text-decoration: none;">← Back</a>
        </p>
    </div>

    <script>
        const API_BASE = window.__Lexicona_API_BASE__ || '/api';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.textContent = "";

            if (password !== confirmPassword) {
                errorMsg.textContent = "Passwords do not match!";
                return;
            }

            const btn = e.target.querySelector('button');
            btn.textContent = "Registering...";
            btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('name', name);
            formData.append('email', email);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.removeItem('lastPdfUrl');
                    localStorage.removeItem('lastPdfId');
                    window.location.href = 'index.html?home=true';
                } else {
                    errorMsg.textContent = data.detail || "Registration failed";
                }
            } catch (err) {
                errorMsg.textContent = "Server error";
            } finally {
                btn.textContent = "Register";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
